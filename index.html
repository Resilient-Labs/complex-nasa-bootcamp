<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="complex-nasa.css">
    <title>Complex NASA API</title>
</head>
<body>
    <header>
    <h1> <img id= 'logo' src= 'img/nasa-logo.png' alt="'NASA Logo">What's the Weather at NASA?</h1>

    <p>"Under what conditions must we search the sky?" - Astronomer</p>
    <p> Use this web app to see the weather at any of the 400+ NASA Facilities in the USA. Select how many you'd like to view at a time below.</p>

    <button type="button" name="button">Click Here to See</button>
    
    <select name="facilitiesList" id="facilitiesList">
        <option value="25">25</option>
        <option value="50">50</option>
        <option value="100">100</option>
        <option value="200">200</option>
        <option value="485">ALL</option>
    </select>
    </header>

<div id="table-wrap">
    <table> 
        <tr>
            <th scope="col">Name</th>
            <th scope="col">Location</th>
            <th scope="col">Weather</th>
        </tr>
    </table>
</div>

    

<script src="complex-nasa.js"></script>
</body>
</html>
